<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none" role="img" aria-labelledby="archTitle">
  <title id="archTitle">System architecture  design, services, and data layers</title>
  <defs>
    <linearGradient id="gPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d28" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#0e1018" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8ff5a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#c8ff5a"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity=".8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="1">
    <path d="M80 80 H880 M80 140 H880 M80 200 H880 M80 260 H880 M80 320 H880 M80 380 H880 M80 440 H880 M80 500 H880"/>
    <path d="M120 60 V540 M200 60 V540 M280 60 V540 M360 60 V540 M440 60 V540 M520 60 V540 M600 60 V540 M680 60 V540 M760 60 V540 M840 60 V540"/>
  </g>

  <!-- bottom layer: data -->
  <g transform="translate(180 330)">
    <path d="M0 80 L280 0 L560 80 L280 160 Z" fill="url(#gPlane)" stroke="#ffffff" stroke-opacity=".18"/>
    <path d="M0 80 L0 110 L280 190 L560 110 L560 80 L280 160 Z" fill="#0a0c12" stroke="#ffffff" stroke-opacity=".12"/>
    <g fill="#c8ff5a" filter="url(#glow)">
      <circle cx="140" cy="100" r="3"/><circle cx="220" cy="78" r="2.5"/><circle cx="300" cy="100" r="3"/><circle cx="380" cy="78" r="2.5"/><circle cx="460" cy="100" r="3"/>
    </g>
    <g stroke="#c8ff5a" stroke-opacity=".55" stroke-width="1.4">
      <path d="M140 100 L220 78 L300 100 L380 78 L460 100"/>
      <path d="M220 78 L220 130 M380 78 L380 130"/>
    </g>
    <!-- code braces -->
    <text x="60" y="118" fill="#c8ff5a" font-family="Archivo,sans-serif" font-size="42" font-weight="700" opacity=".9">{ }</text>
    <!-- db cylinders -->
    <ellipse cx="420" cy="118" rx="28" ry="10" fill="#151821" stroke="#ff3d00" stroke-opacity=".7"/>
    <rect x="392" y="118" width="56" height="28" fill="#151821"/>
    <ellipse cx="420" cy="146" rx="28" ry="10" fill="#10131a" stroke="#ff3d00" stroke-opacity=".5"/>
    <ellipse cx="490" cy="108" rx="22" ry="8" fill="#151821" stroke="#c8ff5a" stroke-opacity=".5"/>
    <rect x="468" y="108" width="44" height="22" fill="#151821"/>
    <ellipse cx="490" cy="130" rx="22" ry="8" fill="#10131a" stroke="#c8ff5a" stroke-opacity=".35"/>
  </g>

  <!-- middle layer: services -->
  <g transform="translate(140 200)">
    <path d="M0 80 L300 0 L600 80 L300 160 Z" fill="url(#gPlane)" stroke="#ffffff" stroke-opacity=".2"/>
    <path d="M0 80 L0 108 L300 188 L600 108 L600 80 L300 160 Z" fill="#0b0d14" stroke="#ffffff" stroke-opacity=".12"/>
    <g>
      <rect x="120" y="70" width="44" height="44" rx="8" fill="#141824" stroke="#c8ff5a" stroke-opacity=".45" transform="skewX(-18)"/>
      <rect x="190" y="52" width="44" height="44" rx="8" fill="#141824" stroke="#ffffff" stroke-opacity=".25" transform="skewX(-18)"/>
      <rect x="260" y="70" width="44" height="44" rx="8" fill="#141824" stroke="#ff3d00" stroke-opacity=".75" transform="skewX(-18)" filter="url(#glow)"/>
      <rect x="330" y="52" width="44" height="44" rx="8" fill="#141824" stroke="#ffffff" stroke-opacity=".25" transform="skewX(-18)"/>
      <rect x="400" y="70" width="44" height="44" rx="8" fill="#141824" stroke="#c8ff5a" stroke-opacity=".45" transform="skewX(-18)"/>
    </g>
    <path d="M150 95 C220 40 340 40 420 95" stroke="url(#gLine)" stroke-width="2" fill="none" filter="url(#glow)"/>
    <circle cx="280" cy="88" r="4" fill="#ff3d00" filter="url(#glow)"/>
  </g>

  <!-- top layer: UI -->
  <g transform="translate(200 70)">
    <path d="M0 70 L260 0 L520 70 L260 140 Z" fill="url(#gPlane)" stroke="#ffffff" stroke-opacity=".22"/>
    <path d="M0 70 L0 96 L260 166 L520 96 L520 70 L260 140 Z" fill="#0c0e16" stroke="#ffffff" stroke-opacity=".12"/>
    <!-- floating panels -->
    <g transform="translate(90 28)">
      <rect width="70" height="88" rx="6" fill="#161a26" stroke="#c8ff5a" stroke-opacity=".5" transform="skewY(-6)"/>
      <rect x="12" y="14" width="40" height="6" rx="2" fill="#c8ff5a" fill-opacity=".35"/>
      <rect x="12" y="28" width="46" height="4" rx="2" fill="#ffffff" fill-opacity=".15"/>
      <rect x="12" y="40" width="36" height="4" rx="2" fill="#ffffff" fill-opacity=".12"/>
      <rect x="12" y="52" width="42" height="4" rx="2" fill="#ffffff" fill-opacity=".12"/>
    </g>
    <g transform="translate(210 10)">
      <rect width="100" height="70" rx="6" fill="#161a26" stroke="#ffffff" stroke-opacity=".28" transform="skewY(-6)"/>
      <rect x="14" y="16" width="28" height="28" rx="4" fill="#ff3d00" fill-opacity=".35"/>
      <rect x="50" y="16" width="36" height="8" rx="2" fill="#ffffff" fill-opacity=".18"/>
      <rect x="50" y="30" width="28" height="6" rx="2" fill="#ffffff" fill-opacity=".12"/>
      <rect x="14" y="52" width="72" height="6" rx="2" fill="#c8ff5a" fill-opacity=".25"/>
    </g>
    <g transform="translate(340 36)">
      <rect width="64" height="76" rx="6" fill="#161a26" stroke="#c8ff5a" stroke-opacity=".4" transform="skewY(-6)"/>
      <circle cx="32" cy="30" r="12" fill="none" stroke="#c8ff5a" stroke-opacity=".55"/>
      <path d="M32 22 V38 M24 30 H40" stroke="#c8ff5a" stroke-opacity=".55"/>
    </g>
    <path d="M160 70 L250 40 L350 55" stroke="#c8ff5a" stroke-opacity=".5" stroke-width="1.5" fill="none"/>
    <circle cx="160" cy="70" r="3" fill="#c8ff5a" filter="url(#glow)"/>
    <circle cx="250" cy="40" r="3" fill="#ff3d00" filter="url(#glow)"/>
    <circle cx="350" cy="55" r="3" fill="#c8ff5a" filter="url(#glow)"/>
  </g>

  <!-- orbital current -->
  <path d="M120 300 C240 180 520 120 820 220" stroke="#c8ff5a" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="6 10" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M100 420 C300 360 640 380 860 300" stroke="#ff3d00" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="4 12" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
